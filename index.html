<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#e5ddd5] font-sans h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-[#075e54] text-white px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-gray-700 font-bold">
        <i class="fa-solid fa-user"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">My Chat App</h1>
        <p class="text-xs text-green-200">Online</p>
      </div>
    </div>
    <div class="flex gap-4 text-lg">
      <i class="fa-solid fa-camera cursor-pointer"></i>
      <i class="fa-solid fa-ellipsis-vertical cursor-pointer"></i>
    </div>
  </header>

  <!-- CHAT MESSAGES AREA -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
    <div class="self-start max-w-[80%] bg-white rounded-lg p-2.5 shadow text-sm text-gray-800">
      <p>Welcome to your WhatsApp clone! Type a message below and hit send. 🚀</p>
      <span class="text-[10px] text-gray-400 block text-right mt-1">12:00 PM</span>
    </div>
  </main>

  <!-- INPUT FOOTER -->
  <footer class="bg-[#f0f0f0] p-2 flex items-center gap-2 border-t">
    <button class="text-gray-600 px-2 text-xl">
      <i class="fa-solid fa-face-smile"></i>
    </button>
    <button class="text-gray-600 px-2 text-xl">
      <i class="fa-solid fa-paperclip"></i>
    </button>
    
    <input 
      id="message-input" 
      type="text" 
      placeholder="Type a message..." 
      class="flex-1 bg-white rounded-full py-2 px-4 text-sm outline-none border focus:border-green-600"
    />

    <button id="send-btn" class="bg-[#075e54] text-white w-10 h-10 rounded-full flex items-center justify-center text-sm shadow">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </footer>

  <!-- JAVASCRIPT FOR CHAT FUNCTIONALITY -->
  <script>
    const sendBtn = document.getElementById('send-btn');
    const messageInput = document.getElementById('message-input');
    const chatBox = document.getElementById('chat-box');

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgDiv = document.createElement('div');
      msgDiv.className = 'self-end max-w-[80%] bg-[#dcf8c6] rounded-lg p-2.5 shadow text-sm text-gray-800 relative';
      msgDiv.innerHTML = `
        <p>${text}</p>
        <span class="text-[10px] text-gray-500 block text-right mt-1">${time} <i class="fa-solid fa-check-double text-blue-500"></i></span>
      `;

      chatBox.appendChild(msgDiv);
      messageInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
